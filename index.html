
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Oops! The page you're looking for could not be found.">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="error-page">
        <header class="topbar">
            <a href="index.html" class="logo">NOVA<span>.</span></a>
            <span class="status"><span class="status-dot"></span> SYSTEM ONLINE</span>
        </header>

        <section class="error-content">
            <div class="illustration" aria-hidden="true">
                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>
                <div class="planet">
                    <div class="planet-ring"></div>
                    <div class="planet-face">
                        <span class="eye eye-left"></span>
                        <span class="eye eye-right"></span>
                        <span class="mouth"></span>
                    </div>
                </div>
                <div class="star star-one">✦</div>
                <div class="star star-two">✧</div>
                <div class="star star-three">✦</div>
                <div class="floating-number number-four-left">4</div>
                <div class="floating-number number-four-right">4</div>
                <div class="tiny-planet"></div>
            </div>

            <p class="error-label">ERROR CODE: 404</p>
            <h1>Oops! Lost in <span>space?</span></h1>
            <p class="description">
                Looks like this page has wandered off into the universe.
                Don't worry, even the best explorers take a wrong turn.
            </p>

            <a href="index.html" class="home-button">
                <span>←</span> Back to Home
            </a>

            <p class="help-text">Let's get you back on the right path.</p>
        </section>

        <footer class="footer">
            <span>© 2026 NOVA</span>
            <span>MADE FOR BETTER WEB EXPERIENCES ✦</span>
        </footer>
    </main>
</body>
</html>
